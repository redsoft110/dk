site_name: Outlands - DK工会
site_url: https://uo.micsys.org
theme:
  name: material
  logo: assests/logo.png
  favicon: assests/logo.png
  palette:

   - media: "(prefers-color-scheme: light)"  
     scheme: default
     primary: custom   # 标记为自定义，由css接管
     accent: custom
     toggle:
        icon: material/weather-night
        name: 深色模式
   - media: "(prefers-color-scheme: dark)"  
     scheme: slate
     primary: custom
     accent: custom
     toggle:
        icon: material/weather-sunny
        name: 正常模式

extra_css:
- stylesheets/extra.css
- https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css
  
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

language: zh

features:
  #  - navigation.tabs
     - navigation.top
  #  - navigation.sections
  #  - navigation.instant
  #  - content.code.annotate
  #  - content.code.copy
  #  - content.code.tab
  #  - content.tabs.link
  #  - content.tooltips
  #  - content.footnotes
  #  - content.footers
     - search.highlight
  
copyright: 'copyright © 2000-2026 Micsys All Rights Reserved'

nav:
  - 首页: index.md
  - 技能-skills: 
    - 解破学-Anatomy: skills/Anatomy.md
    - 射箭-Archery: skills/Archery.md
    - 双持-Dual Wielding: skills/Dual Wielding.md
    - 骑士精神-Chivalry: skills/Chivalry.md
  - 系统设置: settings/tongyong.md

extra:
  generator: false
     

