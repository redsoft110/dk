site_name: Outlands - DK工会
site_url: https://redsoft110.github.io/dk/
theme:

  name: material
  icon:
     logo: /png/logo.png
  palette:

   - media: "(prefers-color-scheme: light)"  
     scheme: default
     primary: custom   # 标记为自定义，由css接管
     accent: custom
     toggle:
        icon: material/weather-night
        name: 深色模式
   - media: "(prefers-color-scheme: dark)"  
     scheme: slate
     primary: custom
     accent: custom
     toggle:
        icon: material/weather-sunny
        name: 正常模式

extra_css:
- stylesheets/extra.css
- https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css
  
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

language: zh

features:
  #  - navigation.tabs
     - navigation.top
  #  - navigation.sections
  #  - navigation.instant
  #  - content.code.annotate
